<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102421"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="麻雀収支"><meta name="description" content="店舗別の麻雀成績・収支を記録、月別・年間グラフで振り返る無料アプリ"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>麻雀収支管理アプリ</title></head><body><main class="container"><header><div class="eyebrow">MAHJONG RECORD</div><h1>🀄 麻雀収支管理アプリ</h1><p class="muted">店舗ごとに成績とポイントを記録</p></header><section class="card"><h2>店舗管理</h2><div class="line"><input id="shopName" placeholder="新しい店舗名" maxlength="50"><button id="addShop">追加</button></div><div id="shopsList" class="muted small"></div></section><section class="card"><h2>成績集計</h2><label>店舗<select id="filterShop"></select></label><label>期間<select id="period"><option value="all">全期間</option><option value="month">今月</option><option value="today">今日</option></select></label><div id="stats" class="stats"></div><h3>着順分布</h3><div id="rankBars"></div></section><section class="card"><h2>成績を登録</h2><label>店舗<select id="entryShop"></select></label><label>日付<input type="date" id="date"></label><div id="counters"></div><p class="total">合計 <strong id="gameTotal">0</strong> G</p><label>1日の合計ポイント（＋・－）<input type="number" id="points" step="any" value="0" inputmode="decimal"></label><div class="line"><button id="saveRecord" class="primary">記録を保存</button><button id="cancelEdit" class="secondary hidden">編集取消</button></div><p class="muted small">ポイントはゲーム代等を含む実収支ではありません。現金収支機能は今後追加予定です。</p></section><section class="card"><h2>無料の成績グラフ</h2><label>グラフ<select id="chartType"><option value="monthly">月別ポイント</option><option value="yearly">年別ポイント</option><option value="monthlyGames">月別対局数</option></select></label><div id="chart" class="chart"></div><p class="muted small">グラフは登録データから自動生成されます。</p></section><section class="card"><h2>対局履歴</h2><div id="history"></div></section><section class="card"><h2>バックアップ</h2><p class="muted small">データはこの端末のブラウザ内に保存されます。定期的にバックアップしてください。</p><div class="line"><button id="export" class="secondary">JSONを書き出す</button><label class="filebutton">JSONを読み込む<input id="import" type="file" accept="application/json,.json" hidden></label></div></section><footer class="muted small">無料PWA版 · 広告・課金機能は未実装</footer></main><script src="./app.js" defer></script></body></html>
